name: CI — Page de la Convention CRN 2026

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test

      # Cœur métier de la CRN Boutique (paliers, montants, jetons, droits, quotas, paiements) :
      # mêmes versions de Vitest et TypeScript que le site, sans installation séparée.
      - name: CRN Boutique — cœur métier (types et tests)
        run: |
          npx tsc --noEmit -p boutique/domaine/tsconfig.json
          npx vitest run --root boutique/domaine

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Tests de bout en bout + audit réseau (NF-CNV-001) + accessibilité (NF-CNV-008)
        run: npm run test:e2e
        env:
          CI: true

      - name: Publier le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
